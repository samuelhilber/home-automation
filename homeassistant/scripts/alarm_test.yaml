# Manual test of the alarm chain (ADR-002, ADR-004, ADR-014). It is started by
# hand and is not a real alarm: the existing Sonos alarm stays the safety net.
# The TV is left out on purpose; all TV commands go through one TV script later.
alarm_test:
  alias: Alarm test
  mode: single
  variables:
    zone: media_player.kinderzimmer_kinderzimmer
    playlist: spotify:playlist:37i9dQZF1E8N3mKFwU3tJ8
    volume: 0.05
  sequence:
    # Activity feed (ADR-030): the admin app shows logbook entries named "App: ...".
    # continue_on_error so a logbook problem can never keep the alarm from ringing.
    - action: logbook.log
      continue_on_error: true
      data:
        name: "App: Testwecker gestartet"
        message: "Kinderzimmer, 5 % Lautstärke."
    - action: media_player.volume_set
      target:
        entity_id: "{{ zone }}"
      data:
        volume_level: "{{ volume }}"
    - action: media_player.play_media
      target:
        entity_id: "{{ zone }}"
      data:
        media_content_type: playlist
        media_content_id: "{{ playlist }}"
    # Sonos can report "paused" while the stream starts, which would end the
    # alarm at once; wait until playback has settled before watching for it.
    - delay: "00:00:20"
    # A pause on the speaker counts as the Sonos stop button (ADR-004); without
    # one, stop after 15 minutes.
    - wait_template: "{{ is_state(zone, 'paused') }}"
      timeout: "00:15:00"
      continue_on_timeout: true
    - action: media_player.media_pause
      target:
        entity_id: "{{ zone }}"
    # wait.completed is true when the speaker was paused (the stop button),
    # false after the 15-minute timeout.
    - action: logbook.log
      continue_on_error: true
      data:
        name: "App: Testwecker gestoppt"
        message: "{{ 'Per Sonos-Taste.' if wait.completed else 'Nach 15 Minuten automatisch.' }}"
